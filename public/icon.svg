<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Minimalist dark navy base -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Vibrant cyan/sky blue accent for the minimalist filter -->
    <linearGradient id="primaryBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Airflow gradient -->
    <linearGradient id="airflowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Squircle Canvas with subtle border -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="118" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.12"/>

  <!-- Minimalist Clean Air Waves (Left / Ambient Air) -->
  <path d="M 64 216 H 132" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M 44 256 H 132" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65"/>
  <path d="M 64 296 H 132" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- MINIMALIST AIR FILTER CARTRIDGE -->
  <!-- Outer Filter Frame -->
  <rect 
    x="148" 
    y="120" 
    width="216" 
    height="272" 
    rx="32" 
    fill="#0f172a" 
    stroke="url(#primaryBlue)" 
    stroke-width="14" 
  />

  <!-- Pleated Filter Media (Minimalist Accordion Core) -->
  <!-- 5 clean, distinct vertical pleat louvers / folds with crisp negative space -->
  <g fill="none" stroke-linecap="round">
    <!-- Pleat 1 -->
    <line x1="184" y1="152" x2="184" y2="360" stroke="#38bdf8" stroke-width="10" stroke-opacity="0.85"/>
    
    <!-- Pleat 2 -->
    <line x1="220" y1="152" x2="220" y2="360" stroke="#7dd3fc" stroke-width="10" stroke-opacity="0.95"/>
    
    <!-- Pleat 3 (Center) -->
    <line x1="256" y1="152" x2="256" y2="360" stroke="#ffffff" stroke-width="12"/>
    
    <!-- Pleat 4 -->
    <line x1="292" y1="152" x2="292" y2="360" stroke="#7dd3fc" stroke-width="10" stroke-opacity="0.95"/>
    
    <!-- Pleat 5 -->
    <line x1="328" y1="152" x2="328" y2="360" stroke="#38bdf8" stroke-width="10" stroke-opacity="0.85"/>
  </g>

  <!-- Minimalist Top and Bottom Flanges (Filter Gasket Seals) -->
  <rect x="172" y="138" width="168" height="6" rx="3" fill="#0284c7" fill-opacity="0.7"/>
  <rect x="172" y="368" width="168" height="6" rx="3" fill="#0284c7" fill-opacity="0.7"/>

  <!-- Minimalist Purified Outflow (Right / Pure Air) -->
  <!-- Crisp, modern laminar flow vectors -->
  <g stroke-linecap="round" fill="none">
    <path d="M 380 200 C 416 200, 436 190, 464 190" stroke="url(#airflowGrad)" stroke-width="9"/>
    <path d="M 380 256 C 418 256, 442 256, 478 256" stroke="#ffffff" stroke-width="12"/>
    <path d="M 380 312 C 416 312, 436 322, 464 322" stroke="url(#airflowGrad)" stroke-width="9"/>
  </g>

  <!-- Pure Air Nano-Dots (Subtle Clean Atmosphere) -->
  <circle cx="476" cy="190" r="4.5" fill="#bae6fd"/>
  <circle cx="490" cy="256" r="6" fill="#ffffff"/>
  <circle cx="476" cy="322" r="4.5" fill="#bae6fd"/>
</svg>
